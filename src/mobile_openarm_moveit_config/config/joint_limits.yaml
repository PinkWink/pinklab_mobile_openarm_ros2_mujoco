# MoveIt 계획용 관절 한계 (robot_description_planning).
# 위치 한계는 URDF 값보다 0.01 rad 넓다. 이유: 컨트롤러가 한계에 붙은 목표를 0.0003 rad 정도 넘어서 멈추면
# MoveIt 2.12 의 CheckStartStateBounds 가 시작 상태를 무조건 거부한다(fix_start_state 는 연속 관절 정규화만 한다).
# 값은 artifacts/mobile_generated/robot.urdf 의 limit 에서 생성했다 (왼팔은 미러링되어 좌우가 다르다).
